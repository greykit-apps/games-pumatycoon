  <text x="404" y="312" font-family="Menlo, ui-monospace, monospace" font-size="28" fill="#dbe4fb">Produce. Sell into a moving market.</text>
  <text x="404" y="352" font-family="Menlo, ui-monospace, monospace" font-size="28" fill="#dbe4fb">Outbid your rivals for the railroads.</text>
