    <g fill="#141d33"><rect x="0" y="0" width="150" height="16" rx="3"/><rect x="170" y="0" width="150" height="16" rx="3"/><rect x="340" y="0" width="150" height="16" rx="3"/><rect x="510" y="0" width="150" height="16" rx="3"/><rect x="680" y="0" width="150" height="16" rx="3"/><rect x="850" y="0" width="150" height="16" rx="3"/></g>
    <rect x="36" y="0" width="26" height="16" rx="3" fill="#e8c55a"/>
    <rect x="270" y="0" width="26" height="16" rx="3" fill="#c08850"/>
    <rect x="380" y="0" width="26" height="16" rx="3" fill="#a9b4d0"/>
    <rect x="600" y="0" width="26" height="16" rx="3" fill="#7c8396"/>
